// openq4_profile_ios.cfg — iOS/visionOS platform defaults.
//
// Exec'd before the archived config, so everything here is a starting point the
// player can change and keep. The Steam Deck profile is the precedent for this
// file existing at all; the values differ because a phone is not a Deck.
//
// Shipped as a loose file beside the paks rather than inside pak0, because
// pak0's MD5 is verified by the engine and rebuilding it belongs to the oracle
// meson tree. Folding it into pak0 is the upstreaming shape — see DECISIONS.

// Controllers and gyro. MFi/Xbox/DualSense pads arrive over SDL3's
// GameController backend. Gyro aim is the phone's own IMU, and it is what makes
// a small stick competitive at all for fine aim.
seta in_joystick "1"
seta in_gyro "1"
seta in_gyroSensitivity "0.20"
seta in_gyroDeadZone "0.015"
seta in_joystickLookSensitivity "1.0"
seta in_joystickInvertLook "0"
seta in_touchscreen "1"

// Run by default. There is no comfortable place for a walk modifier on glass,
// and Quake 4's movement is tuned around running.
seta in_alwaysRun "1"

// Presentation. iOS offers FIFO only, so the swap interval IS the frame pace,
// and com_maxfps' busy-spin throttle would burn battery enforcing a cap the
// display link already enforces for free.
seta com_maxfps "0"
seta r_swapInterval "1"

// Belt and braces for the focus-mute guard patched into Session.cpp. iOS has no
// "running but unfocused" state that should silence a game; backgrounding is
// handled by the audio session and interruption notifications instead.
seta s_muteUnfocused "0"

// Two speakers, because that is what a phone has. The engine defaults to 6,
// which makes openal-soft build a six-channel mixer that is downmixed to stereo
// anyway — and on an A19 Pro it is what makes EFX setup fail with
// AL_OUT_OF_MEMORY, silently disabling reverb.
seta s_numberOfSpeakers "2"

// EFX reverb: the device build links static openal-soft, which has it — unlike
// the Apple OpenAL framework the stock macOS build falls back to.
seta s_useEAXReverb "1"

// Post-process anti-aliasing. SMAA 1x costs ~1.7 ms of GPU on an A19 Pro at
// native resolution (0.1.0.48 device round) and the maintainer's judgement on 2026-09-10
// is that the edge quality is not worth it on a phone panel. Off by default.
//
// This line is belt and braces: the settings sheet's "Anti-aliasing (SMAA)"
// switch is the real authority (NSUserDefaults is pushed into r_postAA at boot,
// after both this file and the archived config have been exec'd), and its own
// default is now 0 as well. What this line does is keep a config written by
// this build honest for anyone reading it, and cover a build where the shell
// push has not run yet.
seta r_postAA "0"

// Anisotropic filtering at the maximum. A texture-unit cost that every sibling
// measured as free on Apple GPUs; the Vision Pro window at 3570x2008 could not
// separate 16 from 8 even under thermal throttling (0.1.0.55 round). The
// "balanced" preset would set 4 and the shell's preset picker still can.
seta image_anisotropy "16"

// No MSAA. On the Vision Pro a 2560x1440 window at MSAA 4x is ~8.4 ms of GPU
// and visionOS holds the window at 60 Hz; at MSAA 0 it is ~5.3 ms and the
// system grants 120 Hz (MEASUREMENTS 0.1.0.57). The maintainer's call, 2026-09-17:
// "I prefer 120 fps." The phone has run 0 since the 2026-09-06 A/B. 8x is
// +5 ms over 4x and never a candidate. Heat-haze capture works at every level
// since D-094, so this is purely rate vs. edges.
seta r_multiSamples "0"

// No "press any key to continue" after a single-player map load (the maintainer's call,
// D-109): the map starts as soon as it is ready. Savegame loads never had the
// gate; this removes it from new games and level transitions too. `set`, not
// `seta`: the cvar is not archived, so this line is what reaches an existing
// install on every launch, whatever its saved config says.
set com_skipLoadingContinue "1"
